name: Tag on main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # 步驟 1：讀 pubspec 版本 → 標籤不存在則建立；Release 不存在則串接四平台建置。
  # ⚠️ 架構決策（2026-10-19）：GITHUB_TOKEN 推送的標籤**不會**觸發下游工作流
  #   （GitHub 防遞迴規則）——故本工作流直接串接建置與發佈；release.yml 保留為
  #   「手動推標籤」的後備路徑。冪等性：Release 已存在 → 建置全跳過（自癒）。
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      needs-release: ${{ steps.release_check.outputs.needs-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 讀取 pubspec 版本（去 +build）
        id: version
        run: |
          VER=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //; s/+.*//' | tr -d ' \r')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "版本：v$VER"
      - name: 建立版本標籤（不存在時）
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "標籤 $TAG 已存在，跳過"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG（merge to main 自動標籤）"
            git push origin "$TAG"
            echo "已建立並推送 $TAG"
          fi
      - name: 檢查 Release 是否已發佈（冪等：已發佈則不重建）
        id: release_check
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          if [ "$STATUS" = "404" ]; then
            echo "needs-release=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG 不存在 → 觸發四平台建置"
          else
            echo "needs-release=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG 已存在（HTTP $STATUS）→ 跳過建置"
          fi

  # ── 四平台建置（僅當 Release 缺失；checkout 對準標籤版本；產物檔名含版本號）──
  # 說明：iOS 為未簽名 IPA（Apple Developer 簽名屬 M7）；macOS DMG 未公證（M7）。
  # Windows 安裝檔 = Inno Setup per-user exe（免管理員/免憑證；MSIX 撤回，Store 屬 SP-7）。
  # P0 測試把關由同 push 的 CI 工作流負責（analyze＋test）。

  build-android:
    needs: tag
    if: needs.tag.outputs.needs-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.tag.outputs.version }}
      - name: 讀取版本號
        run: |
          echo "VER=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //; s/+.*//' | tr -d ' \r')" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=APP_VERSION=$VER
      - name: 重新命名 APK（含版本號）
        run: mv build/app/outputs/flutter-apk/app-release.apk "LedgerSync-android-$VER.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: LedgerSync-android-*.apk

  build-windows:
    needs: tag
    if: needs.tag.outputs.needs-release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.tag.outputs.version }}
      - name: 讀取版本號
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version: ').Line -replace 'version: ','' -replace '\+.*',''
          "VER=$ver" >> $env:GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=APP_VERSION=$env:VER
      # ⚠ 可攜 zip 必須含整個 Release 資料夾（缺 data/ 則 exe 無法啟動＝v0.4.0 缺陷）。
      - name: 打包可攜 zip（含版本號、含 data/）
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "LedgerSync-windows-x64-$env:VER.zip"
      - name: 編譯 Inno Setup 安裝檔（per-user exe，含版本號）
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAPP_VERSION="$env:VER" tool\setup_windows.iss
          Move-Item tool\Output\LedgerSync-setup-*.exe LedgerSync-setup-$env:VER.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            LedgerSync-setup-*.exe
            LedgerSync-windows-x64-*.zip

  build-macos:
    needs: tag
    if: needs.tag.outputs.needs-release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.tag.outputs.version }}
      - name: 讀取版本號
        run: |
          echo "VER=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //; s/+.*//' | tr -d ' \r')" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=APP_VERSION=$VER
      - name: 打包 .app 為 DMG（macOS 標準安裝映像；notarization 屬 M7）
        run: |
          hdiutil create -volname LedgerSync -srcfolder build/macos/Build/Products/Release/ledger_sync.app -ov -format UDZO "LedgerSync-macos-$VER.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: LedgerSync-macos-*.dmg

  build-ios:
    needs: tag
    if: needs.tag.outputs.needs-release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.tag.outputs.version }}
      - name: 讀取版本號
        run: |
          echo "VER=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //; s/+.*//' | tr -d ' \r')" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=APP_VERSION=$VER
      - name: 打包 IPA（未簽名——Apple Developer 簽名屬 M7）
        run: |
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -qry "LedgerSync-ios-$VER.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/LedgerSync-ios-*.ipa

  # 步驟 2：發佈 GitHub Release（四平台產物；全建置成功才發——任一失敗不發半套，
  # 下次 main push 自動重試）。
  release:
    needs: [tag, build-android, build-windows, build-macos, build-ios]
    if: needs.tag.outputs.needs-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: actions/checkout@v4
      - name: 取出本版發行說明（CHANGELOG.md；PM 2026-10-26 規則）
        id: notes
        run: |
          VER="${{ needs.tag.outputs.version }}"
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v v="$VER" '$0 ~ ("^## \\[" v "\\]") {f=1; next} f && /^## \\[/ {exit} f {print}' CHANGELOG.md)
          fi
          if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$NOTES" > release_notes.md
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CHANGELOG.md 找不到 v$VER 的版本區段——本版發行說明為空，請補登後修正 Release。"
            printf '%s\n' "> ⚠️ 本版未於 CHANGELOG.md 找到版本說明（v${VER}）——請補登後編輯本 Release 說明。" > release_notes.md
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 發佈 GitHub Release（四平台產物＋本版發行說明）
        uses: softprops/action-gh-release@v2
        with:
          # PM 2026-10-26：發行說明取自 CHANGELOG.md 本版區段（找不到→警示＋佔位）。
          body_path: release_notes.md
          generate_release_notes: false
          tag_name: v${{ needs.tag.outputs.version }}
          files: |
            dist/LedgerSync-android-*.apk
            dist/LedgerSync-setup-*.exe
            dist/LedgerSync-windows-x64-*.zip
            dist/LedgerSync-macos-*.dmg
            dist/LedgerSync-ios-*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
