name: Release

# 後備路徑：手動推標籤時觸發（主徑為 tag-on-main.yml 的單工作流串接）。
# 產物規格與 tag-on-main.yml 相同：檔名含版本號、Windows Inno Setup per-user exe
# ＋可攜 zip、macOS DMG、iOS 未簽名 IPA（Apple Developer 簽名屬 M7）、Android APK。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 讀取版本號（自標籤）
        run: echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=APP_VERSION=$VER
      - name: 重新命名 APK（含版本號）
        run: mv build/app/outputs/flutter-apk/app-release.apk "LedgerSync-android-$VER.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: LedgerSync-android-*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 讀取版本號（自標籤）
        shell: pwsh
        run: "echo \"VER=$($env:GITHUB_REF_NAME -replace '^v','')\" >> $env:GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=APP_VERSION=$env:VER
      # ⚠ 可攜 zip 必須含整個 Release 資料夾（缺 data/ 則 exe 無法啟動＝v0.4.0 缺陷）。
      - name: 打包可攜 zip（含版本號、含 data/）
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "LedgerSync-windows-x64-$env:VER.zip"
      - name: 編譯 Inno Setup 安裝檔（per-user exe，含版本號）
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAPP_VERSION="$env:VER" tool\setup_windows.iss
          Move-Item tool\Output\LedgerSync-setup-*.exe LedgerSync-setup-$env:VER.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            LedgerSync-setup-*.exe
            LedgerSync-windows-x64-*.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 讀取版本號（自標籤）
        run: echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=APP_VERSION=$VER
      - name: 打包 .app 為 DMG（macOS 標準安裝映像；notarization 屬 M7）
        run: |
          hdiutil create -volname LedgerSync -srcfolder build/macos/Build/Products/Release/ledger_sync.app -ov -format UDZO "LedgerSync-macos-$VER.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: LedgerSync-macos-*.dmg

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 讀取版本號（自標籤）
        run: echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=APP_VERSION=$VER
      - name: 打包 IPA（未簽名——Apple Developer 簽名屬 M7）
        run: |
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -qry "LedgerSync-ios-$VER.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/LedgerSync-ios-*.ipa

  release:
    needs: [build-android, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: actions/checkout@v4
      - name: 取出本版發行說明（CHANGELOG.md；PM 2026-10-26 規則）
        id: notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v v="$VER" '$0 ~ ("^## \\[" v "\\]") {f=1; next} f && /^## \\[/ {exit} f {print}' CHANGELOG.md)
          fi
          if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$NOTES" > release_notes.md
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CHANGELOG.md 找不到 v$VER 的版本區段——本版發行說明為空，請補登後修正 Release。"
            printf '%s\n' "> ⚠️ 本版未於 CHANGELOG.md 找到版本說明（v${VER}）——請補登後編輯本 Release 說明。" > release_notes.md
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 發佈 GitHub Release（四平台產物＋本版發行說明）
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: false
          files: |
            dist/LedgerSync-android-*.apk
            dist/LedgerSync-setup-*.exe
            dist/LedgerSync-windows-x64-*.zip
            dist/LedgerSync-macos-*.dmg
            dist/LedgerSync-ios-*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
