name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7 # 鎖定與本機開發一致的版本（避免 stable 漂移）
          channel: stable
          cache: true
      - name: 安裝依賴
        run: flutter pub get
      - name: 靜態分析（errors/warnings 為 gate；info 不擋）
        run: flutter analyze --no-fatal-infos
        # 2026-11-27：新版 stable 把 flutter/material.dart 標棄用（→material_ui），
        # 全專案 60+ 檔 info 級、非本批改動所致——--no-fatal-infos 讓 info 不擋 CI。
        # 遷移 material_ui 另案（session-todo）。
        # 本機注意：專案路徑含非 ASCII（如「記帳」）時 flutter analyze 的 LSP 會崩潰，
        # 改用 `dart analyze`（同一組 analysis_options 規則）。CI checkout 路徑為 ASCII，不受影響。
      - name: 後端單元/整合測試（@BE，PR gate）
        run: flutter test

  # TODO(T-H9)：truth 對齊測試（drift schema ↔ data-spec.dbml、pubspec ↔ techstack.md）加入本 job
  # TODO(SP-7)：四平台 build（windows/macos：MSIX/DMG notarization）於 M5–M7 加入
