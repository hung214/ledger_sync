<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LedgerSync——本地優先記帳 App：離線可用、雲端同步、發票掃描。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LedgerSync">
  <meta name="theme-color" content="#0B7A75">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LedgerSync 記帳本 · 1121i</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- T83 掃描技術替換（PM 2026-11-24）：html5-qrcode（相機掃描）＋
       @hsuan741220/tw-einvoice-qr（台灣發票格式解析——esbuild IIFE→
       window.TwEin）。本地資源（不依賴 CDN——PWA offline-first）。 -->
  <script src="scan/html5-qrcode.min.js"></script>
  <script src="scan/tw-einvoice.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // P10 新版偵測：主動檢查 Service Worker 更新（Flutter SW 於 activate 時
    // 會自動重載開啟中的頁面——使用者不需手動「重新整理兩次」）。
    // ①App 回到前景時檢查 ②每小時檢查一次。
    if ('serviceWorker' in navigator) {
      const check = () => navigator.serviceWorker.getRegistration()
        .then((reg) => reg && reg.update())
        .catch(() => {});
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') check();
      });
      setInterval(check, 60 * 60 * 1000);
      window.addEventListener('load', () => setTimeout(check, 3000));
      // **T75 自動重載**（PM 2026-11-24）：新 SW skipWaiting 接管後，
      // 當前頁面仍跑舊 JS（iOS PWA standalone 無法下拉重整——PM 看到
      // 的一直是舊版）。controllerchange → 自動 reload 一次，更新免手動。
      let _swRefreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (_swRefreshing) return; // 防 reload 迴圈（重載後再觸發一次即停）。
        _swRefreshing = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
