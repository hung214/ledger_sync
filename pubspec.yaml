name: ledger_sync
description: "LedgerSync — 本地優先跨平台記帳 App（規格：SPEC v0.3 / techstack v0.3.1）"
publish_to: 'none'
version: 0.4.20+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # ── 依 specs/truth/techstack.md §2；版本鎖定以 pubspec.lock 為準，變更須回寫 truth ──
  flutter_riverpod: ^2.6.1        # 狀態管理（research D3）
  go_router: ^14.6.0              # 路由（桌面分欄/深連結）
  sqlite3: ^2.4.4                 # 本地 DB 直連（T-S1 過渡版；drift 暫緩見 TR-7）
  sqlite3_flutter_libs: ^0.5.42   # 四平台 SQLite 原生庫
  sqlcipher_flutter_libs: ">=0.6.0 <1.0.0" # DB 加密（FR-X2；SP-1 驗證四平台）
  cryptography: ^2.9.0            # AES-256-GCM（D8；Argon2id 備份檔密碼用）
  intl: ">=0.19.0 <0.22.0"        # 多語系/幣別格式
  fl_chart: ^0.69.0               # 圖表：甜甜圈/月趨勢（D10；techstack §2.2）
  uuid: ^4.6.0                    # UUIDv7（實體 ID）
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  image: ^4.12.0
  crypto: ^3.0.7
  file_selector: ^1.1.0
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5                # BE 測試 stub（T-H 掛鉤）
  integration_test:
    sdk: flutter

# 工具鏈註記（research TR-7，S0 實測）：drift/build_runner codegen 與 Dart 3.13.5
# （Flutter 3.47.7）相容性問題——analyzer 7.x 無法序列化 SDK dot-shorthand、
# dart_style 3.1.13+ 需 Dart 3.14 fe types、build_runner 2.16.x pub cache 提取損壞。
# M1 前於 CI（Linux）重試或等新版；schema 仍以 specs/truth/data-spec.dbml 為唯一
# 事實來源，現以 sqlite3 直連實作（lib/data/sqlite/），drift 於工具鏈可用時回歸。

flutter:
  uses-material-design: true

  # BDD feature 檔（integration_test 於 app 行程內讀取——macOS/桌面 CWD 非專案根，
  # File 相對路徑失效；以 rootBundle 資產載入，tool/sync_features.ps1 同步後入包）。
  assets:
    - integration_test/features/
